# =============================================================================
# EVA01 CONFIGURATION
#
# Shape the mind and senses of EVA. Adjust the settings below to switch
# deployment modes, configure languages, and swap out her neural engines.
#
# This is the template. Copy it to `eva.yaml` and edit for your machine:
#     cp config/eva.example.yaml config/eva.yaml
# `eva.yaml` is gitignored — keep your local URLs and tweaks out of version control.
# =============================================================================

system:
  # Deployment architecture for EVA.
  # Options: "local", "api"
  #   - local : Direct access to host hardware (microphone, webcam, speakers).
  #   - server   : Headless server mode, awaiting connections from the frontend.
  device: "local"

  # EVA's primary language for reasoning and vocalization.
  # Options: "en", "zh", "fr", "de", "it", "ja", "ko", "ru", "es", "pt", "nl", "multilingual"
  language: "en"

  # Base URL for locally hosted inference engines (e.g., Ollama).
  base_url: "http://localhost:11434"

  # Camera source for EVA's vision.
  # Options:
  #   off            : disable camera entirely
  #   0              : local webcam (device index)
  #   "http://..."   : network stream URL
  camera: 0

  # Heartbeat interval in seconds. off/0 = disabled.
  heartbeat: 600

  # Room feed endpoint — Eva POSTs her mood/senses/speech/artifacts here for the
  # frontend Room to display. Empty = disabled (headless, no Room).
  feed_url: "http://localhost:3000/api/post"

models:
  # The core reasoning engine orchestrating EVA's personality and logic.
  # Common providers: "claude", "groq", "chatgpt", "mistral", "gemini", "llama"
  # AWS: bedrock_converse:us.anthropic.claude-opus-4-6-v1
  # Recommended: "claude-4.0-sonnet" (for highest emotional intelligence)
  main: "anthropic:claude-opus-4-6"

  # The visual cortex: how EVA interprets images from her webcam or the user.
  # Uses LangChain format "provider:model" — e.g. "openai:gpt-4o-mini", "groq:llama-4-scout-17b-16e-instruct"
  vision: "google_genai:gemini-2.5-flash"

  # The auditory cortex: transcribing human speech into text.
  # Common providers: "whisper", "groq", "faster-whisper"
  stt: "faster-whisper"

  # The vocal cords: synthesizing EVA's text responses into speech.
  # Common providers: "edge", "elevenlabs", "kokoro"
  # Recommend: "edge" for free, "elevenlabs" for quality, "kokoro" for local.
  tts: "kokoro"

  # The subconscious processor: running quietly to run small tasks.
  # Common providers: "google", "llama", "chatgpt", "claude", "deepseek-chat"
  utility: "deepseek:deepseek-chat"

  # The multimodal embedding model for EVA's semantic memory + vision (text + image + patch).
  # "alibaba:Qwen3-VL-Embedding-2B" — local server (Qwen3-VL-Embedding-8B recommended).; 
  # "google:gemini-embedding-2" — cloud ()
  embedding: "alibaba:Qwen3-VL-Embedding-2B"

  # The embedding server URL (used by the qwenvl provider; gemini ignores it).
  embedding_url: "http://localhost:8000"
